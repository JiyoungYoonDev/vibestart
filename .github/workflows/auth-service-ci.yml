name: Auth Service CI

on:
  push:
    branches: [master, main, staging]
    paths:
      - "apps/auth-service/**"
  pull_request:
    paths:
      - "apps/auth-service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auth-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test
