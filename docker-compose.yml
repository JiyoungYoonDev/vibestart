services:
  postgres:
    image: postgres:latest
    container_name: vibestart-postgres
    environment:
      POSTGRES_DB: vibestart
      POSTGRES_USER: vibestart
      POSTGRES_PASSWORD: vibestart
    ports:
      - "5432:5432"
    volumes:
      - vibestart-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: vibestart-redis
    ports:
      - "6379:6379"
    volumes:
      - vibestart-redis-data:/data

  auth-service:
    build:
      context: ./apps/auth-service
    container_name: vibestart-auth-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vibestart
      DB_USER: vibestart
      DB_PASSWORD: vibestart
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./apps/web
    container_name: vibestart-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:8081
    depends_on:
      - auth-service

volumes:
  vibestart-postgres-data:
  vibestart-redis-data: