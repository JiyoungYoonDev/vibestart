spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  application:
    name: auth-service

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cors:
    allowed-origins: ${SPRING_CORS_ALLOWED_ORIGINS}
    allowed-methods: ${SPRING_CORS_ALLOWED_METHODS}
    allowed-headers: ${SPRING_CORS_ALLOWED_HEADERS}
    allow-credentials: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

server:
  port: 8080
