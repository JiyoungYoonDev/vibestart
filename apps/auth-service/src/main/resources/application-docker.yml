spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:vibestart_auth}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  application:
    name: auth-service

server:
  port: 8080
